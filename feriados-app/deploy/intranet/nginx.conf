server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The host proxy removes /feriados/ before forwarding the request.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
