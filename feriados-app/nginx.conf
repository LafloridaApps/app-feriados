server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Static bundles must never fall back to the SPA HTML document.
    location ^~ /feriados/assets/ {
        try_files $uri =404;
    }

    # Revalidate the entry point so it references the current build's bundles.
    location = /feriados/index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /feriados/ {
        index index.html;
        try_files $uri $uri/ /feriados/index.html;
    }

    # Proxy for API calls using the BACKEND_URL environment variable
    location /solicitudes/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect root to /feriados/ for convenience
    location = / {
        return 301 /feriados/;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
